[project]
name = "company-kb"
version = "0.1.0"
description = "Permission-aware RAG agent over code, email, docs and transcripts"
requires-python = ">=3.12,<3.13"
dependencies = [
  # ADR-0030: driver + vector type adapter. binary bundles libpq.
  "psycopg[binary]>=3.3",
  "pgvector>=0.5",
  # ADR-0031: embedding runtime. Pulls torch/transformers/tokenizers.
  "sentence-transformers>=6.2",
]

[project.scripts]
kb = "kb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[dependency-groups]
# Tooling only. Runtime dependencies arrive with the code that needs them;
# every new dependency needs a line in docs/DECISIONS.md (guardrail 10).
# ruff and pyright are pinned exactly to match .pre-commit-config.yaml — a
# version skew between the hook and the local tool makes formatting flip-flop.
dev = [
  "ruff==0.17.4",
  "pyright==1.1.414",
  "pytest>=8",
  "pre-commit>=4",
]

[tool.uv]
package = true

# ADR-0031: CPU-only torch. The default PyPI Linux wheel is 539 MB because it
# bundles the CUDA runtime, and CI has no GPU. macOS arm64 wheels are already
# CPU/MPS-only, so this only changes Linux.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # import sorting
  "UP",            # pyupgrade
  "B",             # bugbear
  "SIM",           # simplification
  "PTH",           # prefer pathlib
  "ANN",           # require annotations — pairs with pyright strict
  "S",             # bandit security rules
  "T20",           # no stray print()
  "RUF",
]
ignore = [
  "ANN401",  # Any is acceptable in **kwargs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]  # assert is the point; annotations add noise
"src/kb/cli.py" = ["T201"]     # a CLI's job is to print

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
# Strict from the first commit. ADR-0027: every gate starts green on an empty
# repository, so none of them needs a grandfathering exception later.
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: needs a reachable Postgres (docker compose up -d)",
]
