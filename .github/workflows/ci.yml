name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # Use the Python already on the runner; do not fetch one.
  UV_PYTHON_PREFERENCE: only-system

jobs:
  lint:
    name: ruff + pyright + hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Python from the runner's tool cache, with uv told to use it below.
      # Otherwise uv downloads a standalone CPython from a GitHub release on
      # every run, which 504'd twice in one evening -- a flake worth removing
      # rather than retrying.
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          # Both pins are deliberate. setup-uv publishes no floating v10 tag
          # (its majors stop at v7), so the action needs a full version. And
          # uv itself is pinned to the version that wrote uv.lock, so
          # `uv sync --locked` compares like with like. Bumping uv is a paired
          # change: raise this pin and regenerate the lock together.
          version: "0.9.2"
      - run: uv sync --locked
      - name: pre-commit
        # gitleaks is skipped here: its pre-commit entry scans *staged* changes,
        # of which there are none in CI. The secrets job covers it properly.
        env:
          SKIP: gitleaks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret committed and later deleted is still a
          # leaked secret, and is not fixable by removing the line.
          fetch-depth: 0
      # Cached by version, so the release is fetched once rather than on every
      # run. GitHub's release CDN proved flaky enough in one evening to break
      # this job twice; measured from a developer machine, the same URL
      # succeeded twice and connection-failed once in three attempts.
      - name: Cache gitleaks
        id: gitleaks-cache
        uses: actions/cache@v6
        with:
          path: gitleaks
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-linux-x64
      - name: Install gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        shell: bash
        # Downloaded to a file and verified before extracting, rather than
        # streamed into tar. A truncated response otherwise reaches tar as
        # "gzip: unexpected end of file", which reads like a corrupt release
        # rather than a flaky download -- and it did.
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors --max-time 300 \
            -o gitleaks.tar.gz "$url"
          gzip -t gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          rm -f gitleaks.tar.gz
      - name: Verify the binary
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gitleaks
          ./gitleaks version
      - name: Scan
        # --config explicitly: without it gitleaks falls back to its
        # built-in rules silently, dropping the Voyage rule.
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose .

  test:
    name: pytest
    runs-on: ubuntu-latest
    # A real Postgres, so the integration tests run here instead of skipping.
    # Twelve silently skipped tests are worse than none: the job stays green
    # while proving nothing about the pipeline.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb_local_dev
          POSTGRES_DB: company_kb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kb -d company_kb"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://kb:kb_local_dev@localhost:5432/company_kb
    steps:
      - uses: actions/checkout@v7
      # Python from the runner's tool cache, with uv told to use it below.
      # Otherwise uv downloads a standalone CPython from a GitHub release on
      # every run, which 504'd twice in one evening -- a flake worth removing
      # rather than retrying.
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          # Both pins are deliberate. setup-uv publishes no floating v10 tag
          # (its majors stop at v7), so the action needs a full version. And
          # uv itself is pinned to the version that wrote uv.lock, so
          # `uv sync --locked` compares like with like. Bumping uv is a paired
          # change: raise this pin and regenerate the lock together.
          version: "0.9.2"
      # The dev group carries voyageai, so the Voyage tests run and pyright's
      # verdict does not depend on which extras were passed.
      - run: uv sync --locked
      - name: Apply migrations
        env:
          KB_MIGRATE_TRANSPORT: direct
        run: scripts/migrate.sh
      - name: Tests
        shell: bash
        # `not model` excludes the tests that load the real 288 MB weights.
        # Those are a local and nightly concern, not a per-PR one.
        run: |
          # pipefail, or tee would mask a pytest failure and the job would go
          # green on failing tests.
          set -o pipefail
          uv run pytest -q -m "not model" | tee /tmp/pytest.log
      - name: Integration tests must not skip
        shell: bash
        # Skipping when no database is reachable is a local convenience, not an
        # acceptable CI outcome: the job would pass on unit tests alone while
        # proving nothing about the pipeline. Scoped to the integration marker
        # so an unrelated skip elsewhere cannot mask or fake this signal.
        run: |
          set -o pipefail
          uv run pytest -q -m integration --no-header | tee /tmp/integration.log
          if grep -qE "[0-9]+ (skipped|no tests ran)" /tmp/integration.log; then
            echo "::error::integration tests skipped - Postgres unreachable"
            exit 1
          fi
          echo "integration tests ran"
