name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # Use the Python already on the runner; do not fetch one. Without this, uv
  # downloads a standalone CPython from a GitHub release on every run, which
  # 504'd repeatedly in one evening.
  UV_PYTHON_PREFERENCE: only-system

jobs:
  lint:
    name: ruff + pyright + hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Python from the runner's tool cache, with uv told to use it (see the
      # workflow env above) instead of downloading its own.
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          # Both pins are deliberate. setup-uv publishes no floating v10 tag
          # (its majors stop at v7), so the action needs a full version. And
          # uv itself is pinned to the version that wrote uv.lock, so
          # `uv sync --locked` compares like with like. Bumping uv is a paired
          # change: raise this pin and regenerate the lock together.
          version: "0.9.2"
      - run: uv sync --locked
      - name: pre-commit
        # gitleaks is skipped here: its pre-commit entry scans *staged* changes,
        # of which there are none in CI. The secrets job covers it properly.
        env:
          SKIP: gitleaks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret committed and later deleted is still a
          # leaked secret, and is not fixable by removing the line.
          fetch-depth: 0
      # Cached by version, so the release is fetched once rather than on every
      # run. GitHub's release CDN broke this job twice in one evening.
      - name: Cache gitleaks
        id: gitleaks-cache
        uses: actions/cache@v6
        with:
          path: gitleaks
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-linux-x64
      - name: Install gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        shell: bash
        # Downloaded to a file and verified before extracting, rather than
        # streamed into tar. A truncated response otherwise reaches tar as
        # "gzip: unexpected end of file", which reads like a corrupt release
        # rather than a flaky download -- and it did.
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors --max-time 300 \
            -o gitleaks.tar.gz "$url"
          gzip -t gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          rm -f gitleaks.tar.gz
      - name: Verify the binary
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gitleaks
          ./gitleaks version
      - name: Scan
        # --config explicitly: without it gitleaks falls back to its
        # built-in rules silently, dropping the Voyage rule.
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose .

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Python from the runner's tool cache, with uv told to use it (see the
      # workflow env above) instead of downloading its own.
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          # Both pins are deliberate. setup-uv publishes no floating v10 tag
          # (its majors stop at v7), so the action needs a full version. And
          # uv itself is pinned to the version that wrote uv.lock, so
          # `uv sync --locked` compares like with like. Bumping uv is a paired
          # change: raise this pin and regenerate the lock together.
          version: "0.9.2"
      - run: uv sync --locked
      - run: uv run pytest
